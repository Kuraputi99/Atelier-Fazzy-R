title: "Atelier Fazzy"
url: "https://kuraputi99.github.io"
baseurl: "/Atelier-Fazzy-R"

collections:
  authors:
    output: true
  works:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "ja"
  - scope:
      path: "en"
    values:
      lang: "en"
  - scope:
      path: "_works/ja"
      type: "works"
    values:
      layout: "work"
      lang: "ja"
      page_key: "works"
      permalink: /works/:name.html
  - scope:
      path: "_works/en"
      type: "works"
    values:
      layout: "work"
      lang: "en"
      page_key: "works"
      permalink: /en/works/:name.html