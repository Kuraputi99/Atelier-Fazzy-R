title: "Atelier Fazzy"
url: "https://kuraputi99.github.io"
baseurl: "/Atelier-Fazzy-R"

collections:
  authors:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
      lang: "ja"
  - scope:
      path: "en"
    values:
      lang: "en"