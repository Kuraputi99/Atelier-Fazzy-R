title: "Atelier Fazzy"
url: "https://kuraputi99.github.io"
baseurl: "/Atelier-Fazzy-R"

exclude:
  - README.md

# Worksの作品紹介ページを自動作成する
collection:
  works:
    output: true

#_worksのjaとen内のファイルに自動でFtontMatterを設定する
defaults:
  - scope:
    path: "_works/ja"
    type: works
  values:
    layout: work
    lang: ja
    page_key: works
    permalink: /works/:name.html
  - scope:
    path: "_works/en"
    type: works
  values:
    layout: work
    lang: en
    page_key: works
    permalink: /works/:name.html