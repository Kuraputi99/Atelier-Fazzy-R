<!DOCTYPE html>
<html lang="{{ page.lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% assign t = site.data[page.lang] %}
        <title>{{ t.title[page.page_key] }} | {{ site.title }}</title>
        <link rel="stylesheet" href="{{ '/assets/css/common.css' | relative_url }}">
        <link rel="stylesheet" href="{{ '/assets/css/' | append: page.page_key | append: '.css' | relative_url }}">
    </head>

    <body>
        {% include header.html %}
        <main>
            {{ content }}
        </main>
        {% include footer.html %}
        <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
    </body>
</html>
