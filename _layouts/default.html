<!DOCTYPE html>
<html lang="{{ page.lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        {% assign t = site.data[page.lang] %}
        {% if page.page_key %}
            <title>{{ t.title[page.page_key] }} | {{ site.title }}</title>
        {% else %}
            <title>{{ page.title }} | {{ site.title }}</title>
        {% endif %}
        <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    </head>
    <body>
        {% include header.html %}
        <main>
            {{ content }}
        </main>
        {% include footer.html %}
    </body>
</html>
